name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core metrics
        run: dotnet test .\tests\NetStability.Core.Tests\NetStability.Core.Tests.csproj -c Release
      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish .\src\NetStability.App\NetStability.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o .\artifacts\win-x64
      - name: Smoke test app startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ".\artifacts\win-x64\NetStability.exe" -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) {
              throw "NetStability exited during startup with code $($app.ExitCode)."
            }
          }
          finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NetStability-win-x64
          path: .\artifacts\win-x64\NetStability.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Release v1.1.0'
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NetStability-win-x64
          path: .\release
      - name: Publish GitHub release and attach executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create v1.1.0 .\release\NetStability.exe --title "NetStability v1.1.0" --notes-file .\docs\release-notes-v1.1.0.md --target $env:GITHUB_SHA
